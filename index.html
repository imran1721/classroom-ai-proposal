<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Classroom Learning Platform — Docs</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; color: #1f2328; }
  header { position: sticky; top: 0; z-index: 10; display: flex; gap: 8px; align-items: center;
           padding: 12px 20px; border-bottom: 1px solid #d1d9e0; background: #fff; }
  header b { margin-right: auto; font-size: 15px; }
  button { padding: 6px 14px; border: 1px solid #d1d9e0; border-radius: 6px; background: #f6f8fa;
           cursor: pointer; font-size: 14px; }
  button.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .markdown-body { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }
  @media print { header { display: none; } }
</style>
</head>
<body>
<header>
  <b>AI Classroom Learning Platform</b>
  <button id="b-proposal" class="active" onclick="load('docs/PROPOSAL.md', this)">Proposal</button>
  <button id="b-prd" onclick="load('docs/PRD.md', this)">PRD</button>
  <button onclick="window.print()">Print / PDF</button>
</header>
<article id="content" class="markdown-body">Loading…</article>
<script>
  async function load(path, btn) {
    document.querySelectorAll('header button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const res = await fetch(path);
    document.getElementById('content').innerHTML = marked.parse(await res.text());
    window.scrollTo(0, 0);
  }
  load('docs/PROPOSAL.md');
</script>
</body>
</html>
